<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>정재호 · IT 인프라 / 업무 자동화 포트폴리오</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{
    --paper:#F5F7F8;
    --surface:#FFFFFF;
    --ink:#141C26;
    --ink-soft:#2C3947;
    --muted:#5C6875;
    --faint:#8A95A1;
    --line:#E3E7EC;
    --line-strong:#D2D8DF;
    --teal:#0C7A85;
    --teal-bright:#12A3AE;
    --teal-wash:#E8F4F5;
    --good:#1FA46B;
    --amber:#C77D22;
    --radius:14px;
    --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
    --disp:'Space Grotesk','Pretendard',sans-serif;
    --body:'Pretendard','Space Grotesk',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:var(--body);
    color:var(--ink);
    background:var(--paper);
    line-height:1.65;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  .wrap{max-width:920px;margin:0 auto;padding:0 28px}

  /* eyebrow / mono labels */
  .eyebrow{
    font-family:var(--mono);
    font-size:.72rem;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--teal);
    font-weight:600;
    display:inline-flex;align-items:center;gap:9px;
  }
  .eyebrow::before{
    content:"";width:20px;height:1.5px;background:var(--teal);display:inline-block;
  }

  /* ---------- HERO ---------- */
  header.hero{
    position:relative;
    padding:64px 0 46px;
    border-bottom:1px solid var(--line);
    background:
      linear-gradient(180deg,rgba(18,163,174,.05),rgba(18,163,174,0) 60%),
      radial-gradient(circle at 1px 1px,var(--line-strong) 1px,transparent 0);
    background-size:auto,22px 22px;
  }
  .hero-inner{position:relative}
  .hero .eyebrow{margin-bottom:20px}
  .hero h1{
    font-family:var(--disp);
    font-weight:600;
    font-size:clamp(2.5rem,7vw,3.6rem);
    letter-spacing:-.02em;
    line-height:1.02;
    color:var(--ink);
  }
  .hero h1 .en{
    display:block;
    font-size:clamp(.95rem,2.4vw,1.1rem);
    font-weight:500;
    letter-spacing:.02em;
    color:var(--faint);
    margin-top:10px;
    font-family:var(--mono);
  }
  .hero .role{
    margin-top:22px;
    font-family:var(--disp);
    font-size:clamp(1.15rem,3.4vw,1.5rem);
    font-weight:500;
    color:var(--teal);
    letter-spacing:-.01em;
  }
  .hero .thesis{
    margin-top:14px;
    max-width:640px;
    font-size:1.03rem;
    color:var(--ink-soft);
  }
  .statusbar{
    margin-top:30px;
    display:flex;flex-wrap:wrap;gap:10px 12px;
    align-items:center;
  }
  .pill{
    font-family:var(--mono);
    font-size:.74rem;
    letter-spacing:.02em;
    padding:6px 11px 6px 10px;
    border:1px solid var(--line-strong);
    border-radius:999px;
    background:var(--surface);
    color:var(--ink-soft);
    display:inline-flex;align-items:center;gap:7px;
    white-space:nowrap;
  }
  .dot{width:8px;height:8px;border-radius:50%;background:var(--good);display:inline-block;flex:none}
  .pill.live .dot{position:relative}
  .pill.live .dot::after{
    content:"";position:absolute;inset:-4px;border-radius:50%;
    background:var(--good);opacity:.35;animation:pulse 2s ease-out infinite;
  }
  @keyframes pulse{0%{transform:scale(.6);opacity:.5}100%{transform:scale(1.8);opacity:0}}
  .contact{
    margin-top:26px;
    display:flex;flex-wrap:wrap;gap:8px 22px;
    font-family:var(--mono);font-size:.82rem;
  }
  .contact a,.contact span{color:var(--ink-soft);text-decoration:none;display:inline-flex;gap:8px;align-items:center}
  .contact a:hover{color:var(--teal)}
  .contact .k{color:var(--faint)}

  /* ---------- SECTION scaffolding ---------- */
  section{padding:46px 0;border-bottom:1px solid var(--line)}
  .sec-head{margin-bottom:26px}
  .sec-head h2{
    font-family:var(--disp);
    font-size:1.55rem;font-weight:600;letter-spacing:-.02em;margin-top:12px;
  }

  /* ---------- capabilities ---------- */
  .caps{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .cap{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:20px 20px 18px;
    position:relative;
  }
  .cap .cid{font-family:var(--mono);font-size:.7rem;color:var(--faint);letter-spacing:.08em}
  .cap h3{font-size:1.02rem;font-weight:600;margin:9px 0 6px;color:var(--ink)}
  .cap p{font-size:.9rem;color:var(--muted);line-height:1.6}

  /* ---------- projects / services ---------- */
  .svc{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:24px 24px 22px;
    margin-bottom:16px;
    position:relative;
    overflow:hidden;
  }
  .svc::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--teal);
  }
  .svc.hero-svc::before{width:4px;background:linear-gradient(180deg,var(--teal-bright),var(--teal))}
  .svc-top{
    display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;
    margin-bottom:6px;
  }
  .svc-id{font-family:var(--mono);font-size:.72rem;color:var(--faint);letter-spacing:.1em}
  .svc h3{font-family:var(--disp);font-size:1.28rem;font-weight:600;letter-spacing:-.01em;margin:4px 0 2px;color:var(--ink)}
  .svc .meta{font-size:.85rem;color:var(--muted)}
  .status{
    font-family:var(--mono);font-size:.72rem;font-weight:500;
    padding:5px 10px;border-radius:999px;display:inline-flex;align-items:center;gap:7px;
    border:1px solid var(--line-strong);background:var(--paper);color:var(--ink-soft);white-space:nowrap;
  }
  .status.op{color:#0d7a53;background:#EAF7F0;border-color:#BCE6D2}
  .status.op .dot{background:var(--good)}
  .status.done{color:#3d4b59;background:var(--paper)}
  .status.done .dot{background:var(--faint)}
  .stack{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0 14px}
  .chip{
    font-family:var(--mono);font-size:.72rem;
    padding:4px 9px;border-radius:6px;
    background:var(--teal-wash);color:var(--teal);border:1px solid #CDE7E9;
  }
  .svc ul{list-style:none;display:grid;gap:8px}
  .svc li{position:relative;padding-left:20px;font-size:.94rem;color:var(--ink-soft);line-height:1.58}
  .svc li::before{
    content:"▹";position:absolute;left:0;top:0;color:var(--teal);font-size:.9rem;
  }
  .svc li b{color:var(--ink);font-weight:600}
  .detail-btn{
    display:inline-flex;align-items:center;gap:6px;margin-top:8px;
    font-family:var(--mono);font-size:.76rem;font-weight:600;
    padding:6px 12px;border-radius:999px;
    background:var(--teal-wash);color:var(--teal);border:1px solid var(--teal-bright);
